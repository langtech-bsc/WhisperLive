<select id="lang">
  <option value="es">Spanish</option>
  <option value="ca">Catalan</option>
  <option value="gl">Galician</option>
  <option value="eu">Euskera</option>
  <option value="en">English</option>
</select>

<select id="model">
  <option value="tiny">tiny</option>
  <option value="small">small</option>
  <option value="large-v2">large-v2</option>
  <option value="large-v3">large-v3</option>
</select>

<button onclick="startMic()">Start</button>
<button onclick="stopMic()">Stop</button>

<script>
let ws;
let audioCtx;
let processor;
let stream;
let source;

async function startMic() {
  const lang = document.getElementById("lang").value;
  const model = document.getElementById("model").value;

  console.log("WebSocket connecting to ws://127.0.0.1:8052/stream?lang=", lang, "&model=", model);
  ws = new WebSocket(`ws://127.0.0.1:8052/stream?lang=${lang}&model=${model}`);
  ws.binaryType = "arraybuffer";

  ws.onmessage = e => console.log("Transcript:", e.data);

  ws.onopen = async () => {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new AudioContext();
    source = audioCtx.createMediaStreamSource(stream);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = e => {
      const float32 = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        pcm16[i] = Math.max(-1, Math.min(1, float32[i])) * 0x7fff;
      }
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(pcm16.buffer);
      }
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
  };
}

function stopMic() {
  if (processor) {
    processor.disconnect();
    processor.onaudioprocess = null;
  }
  if (source) {
    source.disconnect();
  }
  if (audioCtx) {
    audioCtx.close();
  }
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.close();
  }
  ws = null;
  audioCtx = null;
  processor = null;
  stream = null;
  source = null;
}

</script>
